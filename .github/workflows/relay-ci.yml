name: Relay service CI

on:
  pull_request:
    paths:
      - tools/relay/**
      - .github/workflows/relay-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  https-protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify authentication, leases, isolation and real TLS
        run: node --test tools/relay/server.test.mjs
